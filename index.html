<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>马列毛学习交流社区</title>
    <style>
        /* ================= 全局样式 ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: #f5f5f5; color: #333; padding-bottom: 60px; }
        .page { display: none; }
        .page.active { display: block; }
        
        /* ================= 导航栏 ================= */
        .header { background: #d32f2f; color: #fff; padding: 15px; font-size: 18px; font-weight: bold; text-align: center; position: sticky; top: 0; z-index: 10; display: flex; justify-content: center; align-items: center; }
        .header .back { position: absolute; left: 15px; font-size: 16px; cursor: pointer; }
        
        .bottom-bar { display: none; position: fixed; bottom: 0; width: 100%; height: 60px; background: #fff; border-top: 1px solid #eee; z-index: 100; }
        .tab { flex: 1; text-align: center; line-height: 60px; color: #999; font-size: 15px; cursor: pointer; }
        .tab.active { color: #d32f2f; font-weight: bold; }

        /* ================= 登录/注册页 ================= */
        #page-auth { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #fff; z-index: 9999; display: none; flex-direction: column; padding: 40px 20px; }
        #page-auth.active { display: flex; }
        .auth-logo { font-size: 24px; font-weight: bold; color: #d32f2f; text-align: center; margin-bottom: 30px; margin-top: 30px; }
        
        .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #eee; }
        .auth-tab { flex: 1; text-align: center; padding: 10px; font-size: 18px; font-weight: bold; color: #999; cursor: pointer; }
        .auth-tab.active { color: #d32f2f; border-bottom: 3px solid #d32f2f; }

        .auth-input { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 15px; font-size: 16px; margin-bottom: 15px; outline: none; background: #fafafa; }
        .auth-btn { width: 100%; background: #d32f2f; color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .auth-btn:disabled { background: #e57373; cursor: not-allowed; }

        /* ================= 个人主页 ================= */
        .home-cover { height: 150px; background: linear-gradient(135deg, #d32f2f, #ff5252); width: 100%; position: relative; cursor: pointer; background-size: cover; background-position: center; }
        .cover-tip { position: absolute; right: 10px; bottom: 10px; color: rgba(255,255,255,0.8); font-size: 12px; background: rgba(0,0,0,0.3); padding: 3px 8px; border-radius: 10px; }
        .home-info { background: #fff; text-align: center; padding-bottom: 20px; border-bottom: 1px solid #eee; margin-bottom: 10px; position: relative; }
        .home-avatar { width: 90px; height: 90px; background: #ddd; border-radius: 50%; margin: -45px auto 10px; border: 3px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,.1); cursor: pointer; background-size: cover; background-position: center; position: relative; z-index: 2; }
        .avatar-tip { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #999; white-space: nowrap; }
        .home-name { font-size: 22px; font-weight: bold; color: #333; margin-top: 20px; }
        .admin-badge { background: #d32f2f; color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 10px; margin-left: 5px; vertical-align: middle; display: none; }
        .home-stats { font-size: 14px; color: #666; margin-top: 5px; }

        /* ================= 列表与卡片 ================= */
        .list { padding: 10px; }
        .card { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.05); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
        .card-arrow { color: #ccc; font-size: 18px; }
        .post-card { display: block; position: relative; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; color: #333; }
        .card-desc { font-size: 14px; color: #666; margin-bottom: 10px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .card-meta { font-size: 12px; color: #999; display: flex; justify-content: space-between; }
        .delete-btn { position: absolute; right: 15px; top: 15px; background: #ffeeee; color: #d32f2f; border: 1px solid #ffcccc; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; }

        /* ================= 表单与按钮 ================= */
        .form-group { background: #fff; padding: 15px; margin-bottom: 10px; }
        input, textarea, select { width: 100%; border: 1px solid #ddd; border-radius: 6px; padding: 12px; font-size: 15px; margin-top: 8px; background: #fafafa; outline: none; }
        textarea { height: 150px; resize: none; }
        .btn { width: 100%; background: #d32f2f; color: #fff; border: none; padding: 14px; border-radius: 6px; font-size: 16px; margin-top: 15px; font-weight: bold; cursor: pointer; }
        .btn:disabled { background: #e57373; }

        /* ================= 详情与评论 ================= */
        .detail-box { background: #fff; padding: 20px; margin-bottom: 10px; }
        .detail-title { font-size: 22px; font-weight: bold; margin-bottom: 10px; color: #333; }
        .detail-content { font-size: 16px; line-height: 1.8; margin-bottom: 20px; color: #444; }
        .comment-item { background: #fff; padding: 15px; border-bottom: 1px solid #eee; font-size: 15px; }
        .comment-author { font-size: 13px; color: #d32f2f; margin-bottom: 5px; font-weight: bold; }
        
        /* 点赞按钮 */
        .like-btn { display: inline-block; background: #ffeeee; color: #d32f2f; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; border: 1px solid #ffcccc; cursor: pointer; }
        .like-btn:active { background: #ffcccc; }

        /* ================= 分类栏 ================= */
        .cat-bar { display: flex; background: #fff; border-bottom: 1px solid #eee; }
        .cat-item { flex: 1; text-align: center; padding: 12px; font-weight: bold; color: #666; cursor: pointer; font-size: 16px; }
        .cat-item.active { color: #d32f2f; border-bottom: 3px solid #d32f2f; }

        /* ================= 其他 ================= */
        .empty { text-align: center; color: #999; padding: 40px 0; font-size: 15px; }
        .logout-btn { display: block; width: 90%; margin: 20px auto; text-align: center; background: #fff; color: #d32f2f; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; border: 1px solid #eee; }
    </style>
</head>
<body>

    <!-- 登录/注册页 -->
    <div id="page-auth" class="page active">
        <div class="auth-logo">马列毛学习交流社区</div>
        <div class="auth-tabs">
            <div class="auth-tab active" id="tab-login" onclick="switchAuthMode('login')">登录</div>
            <div class="auth-tab" id="tab-register" onclick="switchAuthMode('register')">注册</div>
        </div>
        <input type="text" id="auth-nickname" class="auth-input" placeholder="请输入昵称">
        <input type="password" id="auth-password" class="auth-input" placeholder="请输入密码">
        <button class="auth-btn" id="auth-submit-btn" onclick="submitAuth()">登 录</button>
    </div>

    <!-- 个人主页 -->
    <div id="page-home" class="page">
        <div class="home-cover" id="home-cover" onclick="uploadImage('cover')">
            <div class="cover-tip">点击更换背景</div>
        </div>
        <div class="home-info">
            <div class="home-avatar" id="home-avatar" onclick="uploadImage('avatar')">
                <div class="avatar-tip">点击设置头像</div>
            </div>
            <div class="home-name">
                <span id="home-nickname">加载中...</span>
                <span id="admin-badge" class="admin-badge">管理员</span>
            </div>
            <div class="home-stats" id="home-post-count">已经发布了 0 篇帖子</div>
        </div>
        <div class="list">
            <div class="card" onclick="loadMyPosts()">
                <span>📝 我的帖子管理</span>
                <span class="card-arrow">›</span>
            </div>
            <div class="card" onclick="showRedeemCode()">
                <span>🎁 兑换码 / 激活特权</span>
                <span class="card-arrow">›</span>
            </div>
            <div class="card" onclick="alert('学习交流社区 v2.0\n支持跨设备云账号、云端点赞。')">
                <span>ℹ️ 关于社区</span>
                <span class="card-arrow">›</span>
            </div>
        </div>
        <div class="logout-btn" onclick="logout()">退出登录</div>
    </div>

    <!-- 看帖列表 -->
    <div id="page-list" class="page">
        <div class="header">学习交流社区</div>
        <div class="cat-bar" id="cat-bar">
            <div class="cat-item active" onclick="switchCategory('article', this)">文章</div>
            <div class="cat-item" onclick="switchCategory('notice', this)">公告</div>
        </div>
        <div class="list" id="post-list-container"></div>
    </div>

    <!-- 帖子详情 -->
    <div id="page-detail" class="page">
        <div class="header">
            <span class="back" onclick="navTo('list')">‹ 返回</span> 详情
        </div>
        <div id="detail-container"></div>
        <div style="padding:10px 15px; font-weight:bold; background:#f5f5f5;">全部回复</div>
        <div id="comment-container"></div>
        <div class="form-group" style="margin-top:10px">
            <input type="text" id="comment-content" placeholder="写下你的回复...">
            <button class="btn" onclick="submitComment()">发送回复</button>
        </div>
    </div>

    <!-- 发帖 -->
    <div id="page-post" class="page">
        <div class="header">发新帖</div>
        <div class="form-group">
            <select id="post-category">
                <option value="article">发布到：文章板块</option>
                <option value="notice" id="notice-option" style="display:none;">发布到：公告（仅管理员）</option>
            </select>
            <input type="text" id="post-title" placeholder="输入标题" maxlength="50">
            <textarea id="post-content" placeholder="输入正文内容..."></textarea>
            <button type="button" class="btn" id="post-submit-btn" onclick="publishPost()">发布</button>
        </div>
    </div>

    <input type="file" id="file-uploader" accept="image/*" style="display:none">
    
    <div class="bottom-bar" id="bottom-bar">
        <div class="tab active" onclick="navTo('home')">主页</div>
        <div class="tab" onclick="navTo('list')">看帖</div>
        <div class="tab" onclick="navTo('post')">发帖</div>
    </div>

    <script>
        var apiUrl = 'https://lyoecyzzlvsgfrgqvjys.supabase.co/rest/v1';
        var headers = {
            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5b2VjeXp6bHZzZ2ZyZ3F2anlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MjIxNTMsImV4cCI6MjEwODk5ODE1M30.rS9n9N6O7A0OvLDnSWbXf_N8N2Iz0c_CsixwI6PPRyQ',
            'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5b2VjeXp6bHZzZ2ZyZ3F2anlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MjIxNTMsImV4cCI6MjEwODk5ODE1M30.rS9n9N6O7A0OvLDnSWbXf_N8N2Iz0c_CsixwI6PPRyQ',
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
        };

        var currentNickname = '';
        var isAdmin = false;
        var currentCategory = 'article';
        var currentPostId = null;
        var currentListMode = 'board';
        var authMode = 'login'; 

        // ================= 1. 登录/注册 =================
        function switchAuthMode(mode) {
            authMode = mode;
            document.getElementById('tab-login').classList.remove('active');
            document.getElementById('tab-register').classList.remove('active');
            if(mode === 'login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('auth-submit-btn').innerText = '登 录';
            } else {
                document.getElementById('tab-register').classList.add('active');
                document.getElementById('auth-submit-btn').innerText = '注 册';
            }
        }

        function checkLoginStatus() {
            var savedNickname = localStorage.getItem('nickname');
            if (savedNickname) {
                currentNickname = savedNickname;
                // 因为管理员状态可能在别的设备改变了，所以这里去云端查一次最新状态
                verifyUserInCloud(currentNickname, true); 
            } else {
                document.getElementById('page-auth').classList.add('active');
                document.getElementById('bottom-bar').style.display = 'none';
            }
        }

        function submitAuth() {
            var nick = document.getElementById('auth-nickname').value.trim();
            var pwd = document.getElementById('auth-password').value.trim();
            if (!nick || !pwd) return alert('昵称和密码不能为空！');

            var btn = document.getElementById('auth-submit-btn');
            btn.disabled = true;
            btn.innerText = '请稍候...';

            if (authMode === 'register') {
                // 注册：先查重，再插入
                fetch(apiUrl + '/users?nickname=eq.' + nick, { headers: headers })
                .then(function(res) { return res.json(); })
                .then(function(users) {
                    if (users.length > 0) {
                        throw new Error('该昵称已被注册！');
                    }
                    return fetch(apiUrl + '/users', {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify({ nickname: nick, password: pwd })
                    });
                })
                .then(function(res) {
                    if(res.ok) {
                        alert('注册成功！请直接登录。');
                        switchAuthMode('login');
                        document.getElementById('auth-password').value = '';
                    } else { alert('注册失败'); }
                })
                .catch(function(err) { alert(err.message); })
                .finally(function() { btn.disabled = false; btn.innerText = '注 册'; });
            } else {
                // 登录：验证账号密码
                fetch(apiUrl + '/users?nickname=eq.' + nick + '&password=eq.' + pwd, { headers: headers })
                .then(function(res) { return res.json(); })
                .then(function(users) {
                    if (users.length === 0) {
                        throw new Error('账号或密码错误！');
                    }
                    var user = users[0];
                    currentNickname = user.nickname;
                    isAdmin = user.is_admin;
                    localStorage.setItem('nickname', currentNickname);
                    enterApp();
                })
                .catch(function(err) { alert(err.message); })
                .finally(function() { btn.disabled = false; btn.innerText = '登 录'; });
            }
        }

        // 验证当前用户是否仍是管理员
        function verifyUserInCloud(nick, doEnter) {
            fetch(apiUrl + '/users?nickname=eq.' + nick, { headers: headers })
            .then(function(res) { return res.json(); })
            .then(function(users) {
                if(users.length > 0) {
                    isAdmin = users[0].is_admin;
                }
                if(doEnter) enterApp();
            });
        }

        function enterApp() {
            document.getElementById('page-auth').classList.remove('active');
            document.getElementById('bottom-bar').style.display = 'flex';
            document.getElementById('home-nickname').innerText = currentNickname;
            
            var savedAvatar = localStorage.getItem('avatar_' + currentNickname);
            if (savedAvatar) document.getElementById('home-avatar').style.backgroundImage = 'url(' + savedAvatar + ')';
            var savedCover = localStorage.getItem('cover_' + currentNickname);
            if (savedCover) document.getElementById('home-cover').style.backgroundImage = 'url(' + savedCover + ')';

            if (isAdmin) {
                document.getElementById('admin-badge').style.display = 'inline-block';
                document.getElementById('notice-option').style.display = 'block';
            } else {
                document.getElementById('admin-badge').style.display = 'none';
                document.getElementById('notice-option').style.display = 'none';
            }

            loadPostCount();
            navTo('home');
        }

        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('nickname');
                location.reload();
            }
        }

        // ================= 2. 兑换码升级 =================
        function showRedeemCode() {
            if (isAdmin) return alert('你已经是管理员了。');
            var code = prompt('请输入兑换码激活特权：');
            if (!code) return;
            if (code === '人民万岁，世界人民大团结') {
                // 云端升级为管理员
                fetch(apiUrl + '/users?nickname=eq.' + currentNickname, {
                    method: 'PATCH',
                    headers: headers,
                    body: JSON.stringify({ is_admin: true })
                })
                .then(function(res) {
                    if(res.ok) {
                        isAdmin = true;
                        document.getElementById('admin-badge').style.display = 'inline-block';
                        document.getElementById('notice-option').style.display = 'block';
                        alert('兑换成功！您已永久获得管理员权限。');
                    }
                });
            } else {
                alert('兑换码无效！');
            }
        }

        // ================= 3. 图片上传 =================
        var uploadType = '';
        function uploadImage(type) {
            uploadType = type;
            document.getElementById('file-uploader').click();
        }

        document.getElementById('file-uploader').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(event) {
                var base64Img = event.target.result;
                if (uploadType === 'avatar') {
                    document.getElementById('home-avatar').style.backgroundImage = 'url(' + base64Img + ')';
                    localStorage.setItem('avatar_' + currentNickname, base64Img);
                } else if (uploadType === 'cover') {
                    document.getElementById('home-cover').style.backgroundImage = 'url(' + base64Img + ')';
                    localStorage.setItem('cover_' + currentNickname, base64Img);
                }
            };
            reader.readAsDataURL(file);
        });

        // ================= 4. 页面导航与列表 =================
        function navTo(pageId) {
            var pages = document.querySelectorAll('.page');
            for (var i = 0; i < pages.length; i++) { pages[i].classList.remove('active'); }
            document.getElementById('page-' + pageId).classList.add('active');
            
            var tabs = document.querySelectorAll('.tab');
            for (var j = 0; j < tabs.length; j++) { tabs[j].classList.remove('active'); }
            
            if (pageId === 'home') {
                tabs[0].classList.add('active');
                loadPostCount();
            } else if (pageId === 'list') {
                tabs[1].classList.add('active');
                if (currentListMode === 'board') {
                    document.getElementById('cat-bar').style.display = 'flex';
                    loadPosts();
                }
            } else if (pageId === 'post') {
                tabs[2].classList.add('active');
            }
            window.scrollTo(0, 0);
        }

        function loadPostCount() {
            fetch(apiUrl + '/posts?select=id&author=eq.' + currentNickname, { headers: headers })
            .then(function(res) { return res.json(); })
            .then(function(posts) {
                if (posts && posts.length >= 0) {
                    document.getElementById('home-post-count').innerText = '已经发布了 ' + posts.length + ' 篇帖子';
                }
            });
        }

        function switchCategory(cat, el) {
            currentCategory = cat;
            currentListMode = 'board';
            var divs = document.querySelectorAll('.cat-item');
            for (var i = 0; i < divs.length; i++) { divs[i].classList.remove('active'); }
            el.classList.add('active');
            loadPosts();
        }

        function loadPosts() {
            var container = document.getElementById('post-list-container');
            container.innerHTML = '<div class="empty">正在加载...</div>';
            fetch(apiUrl + '/posts?select=*&category=eq.' + currentCategory + '&order=created_at.desc', { headers: headers })
            .then(function(res) { return res.json(); })
            .then(function(posts) {
                if (posts.length === 0) {
                    container.innerHTML = '<div class="empty">当前板块暂无帖子</div>';
                    return;
                }
                renderPostList(posts, container);
            });
        }

        function loadMyPosts() {
            currentListMode = 'my';
            navTo('list');
            document.getElementById('cat-bar').style.display = 'none';
            var container = document.getElementById('post-list-container');
            container.innerHTML = '<div class="empty">正在加载我的帖子...</div>';
            fetch(apiUrl + '/posts?select=*&author=eq.' + currentNickname + '&order=created_at.desc', { headers: headers })
            .then(function(res) { return res.json(); })
            .then(function(posts) {
                if (posts.length === 0) {
                    container.innerHTML = '<div class="empty">你还没有发过帖子</div>';
                    return;
                }
                renderPostList(posts, container);
            });
        }

        function renderPostList(posts, container) {
            var html = '';
            posts.forEach(function(post) {
                var timeStr = new Date(post.created_at).toLocaleString();
                var isNotice = post.category === 'notice';
                var catTag = isNotice ? '<span style="color:#d32f2f;font-size:12px;border:1px solid #d32f2f;padding:1px 4px;border-radius:3px;margin-right:5px;">公告</span>' : '';
                
                var showDelete = isAdmin || post.author === currentNickname;
                var deleteBtnHtml = showDelete ? '<div class="delete-btn" onclick="deletePost(event, ' + post.id + ')">删除</div>' : '';

                html += '<div class="card post-card" onclick="openDetail(' + post.id + ')">' +
                            deleteBtnHtml +
                            '<div class="card-title" style="padding-right: 50px;">' + catTag + post.title + '</div>' +
                            '<div class="card-desc">' + post.content + '</div>' +
                            '<div class="card-meta"><span>作者: ' + (post.author || '匿名') + '</span> <span>👍 ' + (post.likes_count||0) + ' | ' + timeStr + '</span></div>' +
                        '</div>';
            });
            container.innerHTML = html;
        }

        // ================= 5. 发帖与删帖 =================
        function publishPost() {
            var cat = document.getElementById('post-category').value;
            var title = document.getElementById('post-title').value.trim();
            var content = document.getElementById('post-content').value.trim();

            if (!title || !content) return alert('标题和正文不能为空！');
            if (cat === 'notice' && !isAdmin) return alert('只有管理员可以发公告！');

            var btn = document.getElementById('post-submit-btn');
            btn.disabled = true;
            btn.innerText = '发布中...';

            fetch(apiUrl + '/posts', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ title: title, content: content, author: currentNickname, category: cat })
            })
            .then(function(res) {
                if (res.ok) {
                    alert('发布成功！');
                    document.getElementById('post-title').value = '';
                    document.getElementById('post-content').value = '';
                    currentCategory = cat;
                    currentListMode = 'board';
                    document.getElementById('cat-bar').style.display = 'flex';
                    var divs = document.querySelectorAll('.cat-item');
                    for (var i = 0; i < divs.length; i++) { divs[i].classList.remove('active'); }
                    if (cat === 'article') { divs[0].classList.add('active'); } else { divs[1].classList.add('active'); }
                    navTo('list');
                } else { alert('发布失败'); }
            })
            .finally(function() {
                btn.disabled = false;
                btn.innerText = '发布';
            });
        }

        function deletePost(event, id) {
            event.stopPropagation();
            if (!confirm('确定要删除这篇帖子吗？')) return;
            fetch(apiUrl + '/posts?id=eq.' + id, { method: 'DELETE', headers: headers })
            .then(function(res) {
                if (res.ok) {
                    alert('删除成功！');
                    if (currentListMode === 'my') { loadMyPosts(); } else { loadPosts(); }
                    loadPostCount();
                } else {
                    alert('删除失败，请检查数据库权限。');
                }
            });
        }

        // ================= 6. 详情与评论 =================
        function openDetail(id) {
            currentPostId = id;
            navTo('detail');
            
            // 获取帖子数据
            fetch(apiUrl + '/posts?id=eq.' + id, { headers: headers })
            .then(function(res) { return res.json(); })
            .then(function(posts) {
                if (posts.length === 0) return;
                var post = posts[0];
                var timeStr = new Date(post.created_at).toLocaleString();
                document.getElementById('detail-container').innerHTML = 
                    '<div class="detail-box">' +
                        '<div class="detail-title">' + post.title + '</div>' +
                        '<div class="card-meta" style="margin-bottom: 15px;">作者: ' + (post.author || '匿名') + ' | ' + timeStr + '</div>' +
                        '<div class="detail-content">' + post.content + '</div>' +
                        '<div class="like-btn" onclick="likePost(' + post.id + ')">👍 点赞 (' + (post.likes_count||0) + ')</div>' +
                    '</div>';
            });

            // 获取评论
            fetch(apiUrl + '/comments?post_id=eq.' + id + '&order=created_at.asc', { headers: headers })
            .then(function(res) { return res.json(); })
            .then(function(comments) {
                var container = document.getElementById('comment-container');
                if (comments.length === 0) {
                    container.innerHTML = '<div class="empty">暂无回复，来抢沙发吧</div>';
                    return;
                }
                var html = '';
                comments.forEach(function(c) {
                    html += '<div class="comment-item"><div class="comment-author">' + (c.author || '匿名') + '</div>' + c.content + '</div>';
                });
                container.innerHTML = html;
            });
        }

        // 点赞功能
        function likePost(id) {
            // 简单实现：直接给 likes_count 加 1
            fetch(apiUrl + '/posts?id=eq.' + id, { headers: headers })
            .then(function(res) { return res.json(); })
            .then(function(posts) {
                if(posts.length > 0) {
                    var currentLikes = posts[0].likes_count || 0;
                    return fetch(apiUrl + '/posts?id=eq.' + id, {
                        method: 'PATCH',
                        headers: headers,
                        body: JSON.stringify({ likes_count: currentLikes + 1 })
                    });
                }
            })
            .then(function() {
                openDetail(id); // 刷新页面看最新点赞
            });
        }

        function submitComment() {
            var content = document.getElementById('comment-content').value.trim();
            if (!content) return alert('回复内容不能为空！');
            fetch(apiUrl + '/comments', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ post_id: currentPostId, content: content, author: currentNickname })
            })
            .then(function(res) {
                if (res.ok) {
                    document.getElementById('comment-content').value = '';
                    openDetail(currentPostId); 
                    alert('回复成功！');
                }
            });
        }

        checkLoginStatus();
    </script>
</body>
</html>
