<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>学习交流社区</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:#f5f5f5;color:#333;padding-bottom:60px}.page{display:none}.page.active{display:block}.header{background:#007aff;color:#fff;padding:15px;font-size:18px;font-weight:bold;text-align:center;position:sticky;top:0;z-index:10}.header .back{position:absolute;left:15px;cursor:pointer}.list{padding:10px}.card{background:#fff;padding:15px;border-radius:8px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.1);cursor:pointer}.card-title{font-size:16px;font-weight:bold;margin-bottom:8px}.card-desc{font-size:13px;color:#666;margin-bottom:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.card-meta{font-size:12px;color:#999;display:flex;justify-content:space-between}.form-group{background:#fff;padding:15px;margin-bottom:10px}input,textarea,select{width:100%;border:1px solid #ddd;border-radius:6px;padding:10px;font-size:15px;margin-top:8px;background:#fafafa}textarea{height:120px;resize:none}.btn{width:100%;background:#007aff;color:#fff;border:none;padding:12px;border-radius:6px;font-size:16px;margin-top:15px;font-weight:bold}.detail-box{background:#fff;padding:15px;margin-bottom:10px}.detail-title{font-size:20px;font-weight:bold;margin-bottom:10px}.detail-content{font-size:15px;line-height:1.6;margin-bottom:20px}.comment-item{background:#fff;padding:15px;border-bottom:1px solid #eee;font-size:14px}.comment-author{font-size:12px;color:#007aff;margin-bottom:5px;font-weight:bold}.bottom-bar{position:fixed;bottom:0;width:100%;height:60px;background:#fff;border-top:1px solid #eee;display:flex;z-index:100}.tab{flex:1;text-align:center;line-height:60px;color:#999;font-size:15px;cursor:pointer}.tab.active{color:#007aff;font-weight:bold}.empty{text-align:center;color:#999;padding:30px 0;font-size:14px}.user-info{background:#fff;padding:30px 20px;text-align:center;border-bottom:1px solid #eee}.avatar{width:70px;height:70px;background:#ddd;border-radius:50%;margin:0 auto 10px}.cat-bar{display:flex;background:#fff;border-bottom:1px solid #eee}.cat-item{flex:1;text-align:center;padding:10px;font-weight:bold;color:#666;cursor:pointer}.cat-item.active{color:#007aff;border-bottom:2px solid #007aff}
</style>
</head>
<body>
<div id="page-home" class="page active">
<div class="header">个人主页</div>
<div class="user-info">
<div class="avatar"></div>
<div style="font-size:18px;font-weight:bold;margin-bottom:10px" id="home-nickname">加载中...</div>
<button class="btn" style="background:#ff3b30;width:auto;padding:5px 15px;font-size:14px;margin:0 auto;display:block" onclick="logout()">退出登录</button>
</div>
<div class="list">
<div class="card" onclick="loadMyPosts()"><div class="card-title">我的帖子</div></div>
</div>
</div>

<div id="page-list" class="page">
<div class="header">马列毛学习交流社区</div>
<div class="cat-bar">
<div class="cat-item active" onclick="switchCategory('article',this)">文章</div>
<div class="cat-item" onclick="switchCategory('notice',this)">公告</div>
</div>
<div class="list" id="post-list-container"></div>
</div>

<div id="page-detail" class="page">
<div class="header"><span class="back" onclick="navTo('list')">‹ 返回</span> 详情</div>
<div id="detail-container"></div>
<div style="padding:10px 15px;font-weight:bold;background:#f5f5f5">全部回复</div>
<div id="comment-container"></div>
<div class="form-group" style="margin-top:10px">
<input type="text" id="comment-content" placeholder="写下你的回复...">
<button class="btn" onclick="submitComment()">发送回复</button>
</div>
</div>

<div id="page-post" class="page">
<div class="header">发新帖</div>
<div class="form-group">
<select id="post-category">
<option value="article">发布到：文章</option>
<option value="notice">发布到：公告</option>
</select>
<input type="text" id="post-title" placeholder="输入标题" maxlength="50">
<textarea id="post-content" placeholder="输入正文内容..."></textarea>
<button type="button" class="btn" onclick="publishPost()">发布</button>
</div>
</div>

<div class="bottom-bar">
<div class="tab active" onclick="navTo('home')">主页</div>
<div class="tab" onclick="navTo('list')">看帖</div>
<div class="tab" onclick="navTo('post')">发帖</div>
</div>

<script>
var apiUrl='https://lyoecyzzlvsgfrgqvjys.supabase.co/rest/v1';
var headers={'apikey':'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5b2VjeXp6bHZzZ2ZyZ3F2anlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MjIxNTMsImV4cCI6MjEwODk5ODE1M30.rS9n9N6O7A0OvLDnSWbXf_N8N2Iz0c_CsixwI6PPRyQ','Authorization':'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5b2VjeXp6bHZzZ2ZyZ3F2anlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MjIxNTMsImV4cCI6MjEwODk5ODE1M30.rS9n9N6O7A0OvLDnSWbXf_N8N2Iz0c_CsixwI6PPRyQ','Content-Type':'application/json','Prefer':'return=representation'};
var currentPostId=null;
var currentCategory='article';
var currentNickname='';

function checkLogin(){
currentNickname=localStorage.getItem('nickname');
if(!currentNickname){
var n=prompt('欢迎！请输入你的昵称:');
if(n&&n.trim()!=''){currentNickname=n.trim();localStorage.setItem('nickname',currentNickname);}
else{checkLogin();}
}else{document.getElementById('home-nickname').innerText=currentNickname;}
}
function logout(){if(confirm('确定退出登录？')){localStorage.removeItem('nickname');location.reload();}}

function navTo(pageId){
var pages=document.querySelectorAll('.page');
for(var i=0;i<pages.length;i++){pages[i].classList.remove('active');}
document.getElementById('page-'+pageId).classList.add('active');
var tabs=document.querySelectorAll('.tab');
for(var j=0;j<tabs.length;j++){tabs[j].classList.remove('active');}
if(pageId==='home'){tabs[0].classList.add('active');}
if(pageId==='list'){tabs[1].classList.add('active');loadPosts();}
if(pageId==='post'){tabs[2].classList.add('active');}
window.scrollTo(0,0);
}

function switchCategory(cat,el){
currentCategory=cat;
var divs=document.querySelectorAll('.cat-item');
for(var i=0;i<divs.length;i++){divs[i].classList.remove('active');}
el.classList.add('active');
loadPosts();
}

function loadPosts(){
var container=document.getElementById('post-list-container');
container.innerHTML='<div class="empty">正在获取数据...</div>';
fetch(apiUrl+'/posts?select=*&category=eq.'+currentCategory+'&order=created_at.desc',{headers:headers}).then(function(res){return res.json();}).then(function(posts){
if(posts.length===0){container.innerHTML='<div class="empty">当前板块暂无帖子</div>';return;}
var html='';
posts.forEach(function(post){
var timeStr=new Date(post.created_at).toLocaleString();
html+='<div class="card" onclick="openDetail('+post.id+')"><div class="card-title">'+post.title+'</div><div class="card-desc">'+post.content+'</div><div class="card-meta"><span>作者: '+(post.author||'匿名')+'</span> <span>'+timeStr+'</span></div></div>';
});
container.innerHTML=html;
});}

function loadMyPosts(){
navTo('list');
var container=document.getElementById('post-list-container');
container.innerHTML='<div class="empty">正在加载我的帖子...</div>';
fetch(apiUrl+'/posts?select=*&author=eq.'+currentNickname+'&order=created_at.desc',{headers:headers}).then(function(res){return res.json();}).then(function(posts){
if(posts.length===0){container.innerHTML='<div class="empty">你还没有发过帖子</div>';return;}
var html='';
posts.forEach(function(post){
var timeStr=new Date(post.created_at).toLocaleString();
html+='<div class="card" onclick="openDetail('+post.id+')"><div class="card-title">'+post.title+'</div><div class="card-desc">'+post.content+'</div><div class="card-meta"><span>作者: '+(post.author||'匿名')+'</span> <span>'+timeStr+'</span></div></div>';
});
container.innerHTML=html;
});}

function publishPost(){
var cat=document.getElementById('post-category').value;
var title=document.getElementById('post-title').value;
var content=document.getElementById('post-content').value;
if(!title||!content)return alert('标题和正文不能为空！');
fetch(apiUrl+'/posts',{method:'POST',headers:headers,body:JSON.stringify({title:title,content:content,author:currentNickname,category:cat})}).then(function(res){
if(res.ok){
alert('发布成功！');
document.getElementById('post-title').value='';
document.getElementById('post-content').value='';
currentCategory=cat;
var divs=document.querySelectorAll('.cat-item');
for(var i=0;i<divs.length;i++){divs[i].classList.remove('active');}
if(cat==='article'){divs[0].classList.add('active');}else{divs[1].classList.add('active');}
navTo('list');
}else{alert('发布失败');}
});}

function openDetail(id){
currentPostId=id;
navTo('detail');
fetch(apiUrl+'/posts?id=eq.'+id,{headers:headers}).then(function(res){return res.json();}).then(function(posts){
if(posts.length===0)return;
var post=posts[0];
var timeStr=new Date(post.created_at).toLocaleString();
document.getElementById('detail-container').innerHTML='<div class="detail-box"><div class="detail-title">'+post.title+'</div><div class="card-meta" style="margin-bottom:15px">作者: '+(post.author||'匿名')+' | '+timeStr+'</div><div class="detail-content">'+post.content+'</div></div>';
});
fetch(apiUrl+'/comments?post_id=eq.'+id+'&order=created_at.asc',{headers:headers}).then(function(res){return res.json();}).then(function(comments){
var container=document.getElementById('comment-container');
if(comments.length===0){container.innerHTML='<div class="empty">暂无回复</div>';return;}
var html='';
comments.forEach(function(c){html+='<div class="comment-item"><div class="comment-author">'+(c.author||'匿名')+'</div>'+c.content+'</div>';});
container.innerHTML=html;
});}

function submitComment(){
var content=document.getElementById('comment-content').value;
if(!content)return alert('回复内容不能为空！');
fetch(apiUrl+'/comments',{method:'POST',headers:headers,body:JSON.stringify({post_id:currentPostId,content:content,author:currentNickname})}).then(function(res){
if(res.ok){
document.getElementById('comment-content').value='';
openDetail(currentPostId);
alert('回复成功！');
}
});}

checkLogin();
navTo('home');
</script>
</body>
</html>
